apiVersion: v1
kind: Service
metadata:
  name: aiops-assistant
  namespace: aiops
  labels:
    app: aiops-assistant
spec:
  type: NodePort
  selector:
    app: aiops-assistant
  ports:
    - name:       http
      protocol:   TCP
      port:       80          # Service port
      targetPort: 8000        # Pod port
      nodePort:   30080       # External node port (30000-32767)
